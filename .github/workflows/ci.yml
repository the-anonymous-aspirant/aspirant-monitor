name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    # Image builds of one ref run one at a time, newest last, so two merges
    # landing seconds apart cannot push :latest out of commit order (system_3
    # #9966). On this job only: test runs, PR or main, are not queued.
    concurrency:
      group: build-image-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The concurrency group above orders main's image builds, but a re-run of
      # an older commit joins the same queue and would still retag :latest with
      # it, rolling the deploy back. So the moving tags (:latest, :main) go only
      # on a build of the commit that is main's head right now; any other build
      # still pushes its sha- tag. If the head cannot be read, the build fails
      # rather than guessing (system_3 #9966/#9984; aspirant-client #409).
      - name: Is this commit main's head?
        id: head
        run: bash scripts/is-main-head.sh "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `type=sha` emits `sha-<short7>`, which is the identity system_3's
      # deploy-freshness sweep asserts (scripts/deploy_freshness_sweep.py:190
      # and fetch_head_sha, which truncates origin/main's HEAD to 7 chars).
      # Publishing only `:latest` left this service reading "never published
      # (no image for HEAD)" even when the image was fresh, because a moving
      # tag cannot answer "is THIS commit published". Same three rules
      # aspirant-server / -client / -commander already use.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch,enable=${{ steps.head.outputs.is_head == 'true' }}
            type=sha
            type=raw,value=latest,enable=${{ steps.head.outputs.is_head == 'true' }}
      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile-Monitor
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
